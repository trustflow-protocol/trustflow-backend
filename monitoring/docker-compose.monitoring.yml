# Optional local Grafana + Prometheus stack for working on the dashboard in
# monitoring/dashboards/trustflow-overview.json. Not part of the root docker-compose.yml
# (that file is scoped to backend runtime dependencies — redis/postgres) and not used in CI.
#
# Usage (from the repo root):
#   npm --prefix backend run dev                      # backend serving /metrics on :3001
#   docker compose -f monitoring/docker-compose.monitoring.yml up -d
#   open http://localhost:3000   (admin/admin)
#
# The dashboard loads read-only (provisioning-only, see provisioning/dashboards/dashboards.yaml).
# To change it: edit dashboards/trustflow-overview.json, commit it, then either restart
# Grafana or wait for the 30s provisioning reload.
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.3.1
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./dashboards:/etc/grafana/provisioning/dashboards/trustflow:ro
    ports:
      - "3000:3000"
